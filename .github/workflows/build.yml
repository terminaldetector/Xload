name: Build APK

# GitHub-hosted runners have normal internet access, unlike the sandbox this
# project was developed in — dl.google.com (Android Gradle Plugin) and
# chaquo.com (Chaquopy's Python runtime) were both blocked there, so :app was
# never actually built end to end, only :core (see README, "Сборка и запуск").
# This workflow is that missing build, running on infrastructure that isn't
# network-restricted.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run :core tests
        run: ./gradlew :core:test

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xload-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
