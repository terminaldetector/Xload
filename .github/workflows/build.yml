name: Build APK

# GitHub-hosted runners have normal internet access, unlike the sandbox this
# project was developed in — dl.google.com (Android Gradle Plugin) and
# chaquo.com (Chaquopy's Python runtime) were both blocked there, so :app was
# never actually built end to end, only :core (see README, "Сборка и запуск").
# This workflow is that missing build, running on infrastructure that isn't
# network-restricted.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Separate from the per-ABI Python interpreters Chaquopy bundles into the
      # APK for the *device* -- this is the build-machine interpreter Chaquopy
      # itself shells out to (to run pip, etc.) while assembling the app, and it
      # must match app/build.gradle.kts's `chaquopy.defaultConfig.version`
      # ("3.11"). ubuntu-latest's preinstalled python3 doesn't satisfy this on
      # its own (confirmed by the previous run: "Couldn't find Python 3.11").
      - name: Set up build-time Python 3.11 (required by Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Google removed the legacy standalone "tools" package from the SDK
      # repository manifest (external change, dated ~2026-09-14/15 -- this
      # repo's own run #4 still succeeded with the action's untouched default
      # a few hours before run #5 broke on it, and the same failure shows up
      # across many unrelated projects' CI the same day: sdkmanager errors
      # "Failed to find package 'tools'" and exits 1). The action's default
      # `packages` input is literally "tools platform-tools" (its own
      # action.yml) -- override it to drop just the removed package; our
      # actual build doesn't use the legacy `tools` binaries at all (AGP
      # resolves the specific platform/build-tools versions it needs itself,
      # via cmdline-tools, once licenses are accepted).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run :core tests
        run: ./gradlew :core:test

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xload-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
